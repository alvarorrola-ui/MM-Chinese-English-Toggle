name: Build Windows mod

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mmcht-windows-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Check out source and pinned submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Set up MSVC
        uses: ilammy/msvc-dev-cmd@v1
      - name: Install LLVM 18.1.8
        shell: pwsh
        run: |
          $Clang = Join-Path $env:ProgramFiles "LLVM\bin\clang.exe"
          $VersionText = ""
          if (Test-Path $Clang) {
            $VersionText = (& $Clang --version | Out-String)
          }
          if ($VersionText -notmatch "18\.1\.8") {
            $Installer = Join-Path $env:RUNNER_TEMP "LLVM-18.1.8-win64.exe"
            Invoke-WebRequest -Uri "https://github.com/llvm/llvm-project/releases/download/llvmorg-18.1.8/LLVM-18.1.8-win64.exe" -OutFile $Installer
            if (-not (Test-Path $Installer)) { throw "LLVM installer download failed." }
            $Process = Start-Process -FilePath $Installer -ArgumentList "/S" -Wait -PassThru
            if ($Process.ExitCode -ne 0) { throw "LLVM installer exited with code $($Process.ExitCode)." }
          }
          $VersionText = (& $Clang --version | Out-String)
          Write-Host $VersionText
          if ($VersionText -notmatch "18\.1\.8") { throw "Expected LLVM 18.1.8, got: $VersionText" }
      - name: Install pinyin dependency
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install pypinyin pillow
      - name: Test contextual vocabulary generator
        shell: pwsh
        run: python -m unittest discover -s tools/tests -v
      - name: Download RecompModTool
        shell: pwsh
        run: Invoke-WebRequest -Uri "https://github.com/N64Recomp/N64Recomp/releases/download/mod-tool-release/RecompModTool.exe" -OutFile "$env:RUNNER_TEMP\RecompModTool.exe"
      - name: Build NRM and native input bridge
        shell: pwsh
        run: .\tools\build.ps1
      - name: Upload distribution package
        uses: actions/upload-artifact@v4
        with:
          name: MM-Chinese-English-Toggle-Windows
          path: dist/MM-Chinese-English-Toggle-Windows.zip
          if-no-files-found: error
